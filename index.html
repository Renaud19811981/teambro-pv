<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>#TEAMBRO PV — Démo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#0C1534; --surface:#121C42; --surface-2:#18234F; --encre:#EEF1FF; --encre-2:#A6AFD6; --trait:#25305E;
  --piste:#FF3BA0; --piste-doux:rgba(255,59,160,.16); --herbe:#3C6DFF; --herbe-doux:rgba(60,109,255,.16); --sable:#A254CC; --sable-doux:rgba(162,84,204,.16); --alerte:#FF3BA0;
  --tb-fond:#0A1130; --tb-fond-2:#18234F; --tb-encre:#EEF1FF; --tb-encre-2:#A6AFD6; --tb-or:#FF3BA0; --tb-vert:#6F93FF; --tb-trait:#25305E;
  --rayon:6px; color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --fond:#F3F5FC; --surface:#FFFFFF; --surface-2:#E9EDF9; --encre:#0C1534; --encre-2:#4A5480; --trait:#D3D9EE;
  --piste-doux:rgba(255,59,160,.12); --herbe-doux:rgba(60,109,255,.12); --sable-doux:rgba(162,84,204,.12); --alerte:#D61F7F; color-scheme:light; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.5 Barlow,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;font-weight:600;line-height:1.15;margin:0}
h2{font-size:1.6rem} h3{font-size:1.25rem}
p{margin:.4rem 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #3C6DFF;outline-offset:2px}
.entete{background:#0C1534;color:#EEF1FF;position:relative;border-bottom:1px solid #25305E}
.entete::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#3A6FF5,#A254CC,#F9429E)}
.entete-in{max-width:1280px;margin:0 auto;padding:20px 18px 8px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(2.2rem,6vw,3rem);line-height:1;margin:0}
.brand .a{color:#FF3BA0}.brand .b{color:#3C6DFF}
.demo{display:inline-block;vertical-align:middle;margin-left:10px;font-size:.9rem;background:#FF3BA0;color:#fff;border-radius:6px;padding:2px 8px;letter-spacing:.04em}
.cname{color:#A6AFD6;font-family:"Barlow Condensed",sans-serif;font-size:1.35rem;font-weight:600;margin:6px 0 0}
.cmeta{color:#A6AFD6;font-size:.95rem;margin:2px 0 0}
.cmeta span+span::before{content:"•";margin:0 8px;color:#3C6DFF}
.tete-droite{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.ib{background:#18234F;border:1px solid #25305E;color:#EEF1FF;border-radius:6px;height:40px;padding:0 12px;font-weight:600;cursor:pointer}
.org-logo{width:64px;height:64px;background:#fff;border-radius:6px;padding:4px;object-fit:contain}
.onglets{max-width:1280px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
.onglets button{border:0;background:transparent;padding:11px 14px 9px;cursor:pointer;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:1.15rem;font-weight:700;color:#A6AFD6;border-bottom:3px solid transparent;white-space:nowrap}
.onglets button[aria-selected="true"]{color:#fff;border-bottom-color:#FF3BA0}
main{max-width:1280px;margin:0 auto;padding:20px 16px 70px}
.bloc{background:var(--surface);border:1px solid var(--trait);border-radius:var(--rayon);padding:18px 20px;margin-bottom:18px}
.bloc > h2,.bloc > h3{margin-bottom:10px}
.aide{background:var(--sable-doux);border-left:4px solid var(--sable);padding:10px 14px;border-radius:0 var(--rayon) var(--rayon) 0;max-width:82ch;margin:10px 0}
.aide-courte{color:var(--encre-2);font-size:.92rem;max-width:82ch}
.grille{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
label.champ{display:flex;flex-direction:column;gap:4px;font-size:.92rem;font-weight:500}
input[type=text],input[type=number],input[type=date],input:not([type]),select{background:var(--surface-2);border:1px solid var(--trait);border-radius:var(--rayon);padding:9px 10px;min-height:42px;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--trait);background:var(--surface);padding:9px 16px;min-height:42px;border-radius:var(--rayon);cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.prim{background:#3C6DFF;border-color:#3C6DFF;color:#fff}
.btn.vert{background:var(--herbe);border-color:var(--herbe);color:#fff}
.btn.rouge{background:var(--piste);border-color:var(--piste);color:#fff}
.btn.sable{background:var(--sable);border-color:var(--sable);color:#fff}
.btn.grand{min-height:58px;font-size:1.12rem;padding:12px 22px}
.btn.petit{min-height:32px;padding:4px 10px;font-size:.88rem;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.segment{display:inline-flex;flex-wrap:wrap;border:1px solid var(--trait);border-radius:999px;padding:3px;background:var(--surface-2);gap:2px}
.segment button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap}
.segment button[aria-pressed="true"]{background:#FF3BA0;color:#fff}
.defil{overflow-x:auto;border:1px solid var(--trait);border-radius:var(--rayon)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--trait);text-align:left;white-space:nowrap}
th{font-weight:600;font-size:.85rem;color:var(--encre-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.etiq{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--trait);margin-left:6px;white-space:nowrap}
.etiq.ok{background:var(--herbe-doux);border-color:var(--herbe)}
.etiq.att{background:var(--sable-doux);border-color:var(--sable)}
.etiq.ab{background:var(--piste-doux);border-color:var(--piste)}
.vide{text-align:center;padding:28px 10px;color:var(--encre-2)}
.vide strong{display:block;font-size:1.2rem;color:var(--encre);margin-bottom:6px}
.feuille td.c{padding:0;text-align:center;border-left:1px solid var(--trait);min-width:70px}
.feuille th.c{text-align:center;border-left:1px solid var(--trait)}
.feuille th.c.ici{background:var(--sable-doux);color:var(--encre)}
.feuille td.c button{width:100%;min-height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.06em}
.feuille td.c button:hover:not(:disabled){background:var(--surface-2)}
.feuille td.c .x{color:var(--alerte);font-weight:700}
.feuille td.c .o{color:var(--herbe);font-weight:700}
.feuille tr.au td{background:var(--herbe-doux)}
.feuille tr.au td.nom{box-shadow:inset 4px 0 0 var(--herbe)}
.feuille tr.prep td.nom{box-shadow:inset 4px 0 0 var(--sable)}
.feuille td.best{font-weight:700}
.feuille td.rang{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;font-weight:700;text-align:center}
.feuille .elim td{opacity:.6}
.qui{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin-bottom:10px}
.qui .lbl{font-size:.9rem;color:var(--encre-2)}
.qui strong{font-family:"Barlow Condensed",sans-serif;font-size:2rem;font-weight:700;line-height:1}
.dos{display:inline-block;background:#FF3BA0;color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:700;padding:0 8px;border-radius:4px;margin-right:6px}
.boutons{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.guide{display:grid;grid-template-columns:210px 1fr;gap:20px}
.etapes{list-style:none;margin:0;padding:0;counter-reset:e;border-left:3px solid var(--trait)}
.etapes li{counter-increment:e;padding:7px 0 7px 14px;color:var(--encre-2);position:relative}
.etapes li::before{content:counter(e);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--trait);margin-right:8px;font-size:.85rem;font-weight:600}
.etapes li.fait{color:var(--encre)} .etapes li.fait::before{background:var(--herbe);border-color:var(--herbe);color:#fff}
.etapes li.ici{color:var(--encre);font-weight:600} .etapes li.ici::before{background:var(--piste);border-color:var(--piste);color:#fff}
.guide-corps h3{font-size:1.6rem;margin-bottom:6px}
.gros{font-size:2.1rem;font-family:"Barlow Condensed",sans-serif;font-weight:700;line-height:1.1}
.recap{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:1.15rem;margin:10px 0}
.recap dt{color:var(--encre-2)} .recap dd{margin:0;font-weight:600}
.appel{border:2px solid var(--herbe);border-radius:var(--rayon);padding:12px 16px;margin:10px 0;background:var(--herbe-doux)}
.appel .lbl{font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:8px}
.appel .nom{font-family:"Barlow Condensed",sans-serif;font-size:2.3rem;font-weight:700;line-height:1.05}
.appel .club{color:var(--encre-2);font-size:.95rem}
.appel.prep{border-color:var(--sable);background:var(--sable-doux)} .appel.prep .nom{font-size:1.5rem}
.clign{width:12px;height:12px;border-radius:50%;background:var(--herbe);animation:clign 1s steps(2,start) infinite}
@keyframes clign{to{visibility:hidden}}
.compte{font-family:"Barlow Condensed",sans-serif;font-size:4.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.compte.urgent{color:var(--alerte)}
.barre-g{font-family:"Barlow Condensed",sans-serif;font-size:clamp(4rem,10vw,6.5rem);font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.barre-g small{font-size:.38em;color:var(--encre-2);font-weight:600}
.deux{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.liste{list-style:none;margin:0;padding:0}
.liste li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--trait)}
.pts{display:flex;gap:8px;margin:10px 0}
.pt{width:34px;height:34px;border-radius:50%;border:2px solid var(--trait);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;background:var(--surface)}
.pt.O{background:var(--herbe);border-color:var(--herbe);color:#fff}
.pt.X{background:var(--piste);border-color:var(--piste);color:#fff}
.pt.P{background:var(--surface-2);color:var(--encre-2)}
.pt.R{border-style:dashed;border-color:var(--piste);color:var(--piste)}
.tableau{background:var(--tb-fond);color:var(--tb-encre);border-radius:10px;padding:clamp(14px,2.2vw,32px);font-variant-numeric:tabular-nums;min-height:480px;display:flex;flex-direction:column;gap:clamp(12px,1.6vw,22px);position:relative;overflow:hidden}
.tableau::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#3A6FF5,#A254CC,#F9429E)}
.tableau{border:1px solid #25305E}
.tb-haut{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--tb-trait);padding-bottom:10px;margin-top:6px}
.tb-haut h2{font-size:clamp(1.4rem,2.6vw,2.6rem);font-weight:700}
.tb-tour{font-family:"Barlow Condensed",sans-serif;font-size:clamp(1.1rem,2vw,2rem);color:var(--tb-or);font-weight:600}
.tb-milieu{display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(12px,1.6vw,22px)}
.tb-carte{background:var(--tb-fond-2);border:1px solid var(--tb-trait);border-radius:8px;padding:clamp(12px,1.4vw,22px)}
.tb-lbl{font-size:clamp(.95rem,1.3vw,1.3rem);color:var(--tb-encre-2);margin:0;display:flex;align-items:center;gap:10px}
.tb-nom{font-family:"Barlow Condensed",sans-serif;font-size:clamp(2.1rem,5vw,5.2rem);font-weight:700;line-height:1;margin:6px 0 4px}
.actif .tb-nom{animation:tbclign 1.1s ease-in-out infinite}
@keyframes tbclign{50%{color:var(--tb-or)}}
.tb-dos{display:inline-block;background:var(--tb-or);color:#fff;border-radius:6px;padding:0 .3em;margin-right:.25em}
.tb-club{color:var(--tb-encre-2);font-size:clamp(.95rem,1.4vw,1.4rem)}
.tb-nom2{font-family:"Barlow Condensed",sans-serif;font-size:clamp(1.4rem,2.8vw,2.8rem);font-weight:600}
.tb-chrono{font-family:"Barlow Condensed",sans-serif;font-size:clamp(3.2rem,8vw,8rem);font-weight:700;line-height:1;color:var(--tb-vert)}
.tb-chrono.urgent{color:#FF3BA0}
.tb-perf{font-family:"Barlow Condensed",sans-serif;font-size:clamp(2rem,4.4vw,4.4rem);font-weight:700;color:#EEF1FF;line-height:1}
.tb-perf.x{color:#FF3BA0}
.tb-pts{display:flex;gap:clamp(6px,1vw,12px);margin-top:12px}
.tb-pt{width:clamp(30px,3.6vw,52px);height:clamp(30px,3.6vw,52px);border-radius:50%;border:2px solid var(--tb-trait);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(1rem,1.8vw,1.7rem)}
.tb-pt.O{background:#3C6DFF;border-color:#3C6DFF;color:#fff}
.tb-pt.X{background:#FF3BA0;border-color:#FF3BA0;color:#fff}
.tb-pt.P{color:var(--tb-encre-2)}
.tb-pt.R{border-style:dashed;border-color:#FF3BA0;color:#FF3BA0}
.tableau th{background:transparent;color:var(--tb-encre-2);border-bottom:1px solid var(--tb-trait)}
.tableau td{border-bottom:1px solid var(--tb-trait);font-size:clamp(1rem,1.5vw,1.6rem)}
.tableau td.rg{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--tb-or);text-align:center}
.tableau td.pf{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-align:right}
.tableau td.es{color:var(--tb-encre-2);font-size:clamp(.8rem,1.1vw,1.15rem)}
.tableau tr.au td{background:rgba(255,59,160,.12)}
.tableau tr.elim td{opacity:.55}
.tb-defil{overflow-x:auto}
.tb-etat{display:inline-block;font-size:clamp(.8rem,1.1vw,1.1rem);font-weight:600;border-radius:999px;padding:1px 10px;border:1px solid var(--tb-trait);color:var(--tb-encre-2)}
.tb-etat.ok{background:rgba(60,109,255,.18);border-color:#3C6DFF;color:#6F93FF}
.tb-etat.ess{background:rgba(255,59,160,.14);border-color:var(--tb-or);color:var(--tb-or)}
.tb-etat.ko{border-color:#FF3BA0;color:#FF3BA0}
.tb-record{background:linear-gradient(90deg,#3A6FF5,#A254CC,#F9429E);color:#fff;border-radius:8px;padding:clamp(10px,1.4vw,18px) clamp(14px,2vw,26px);display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.tb-record-t{font-family:"Barlow Condensed",sans-serif;font-size:clamp(1.5rem,3.2vw,3.2rem);font-weight:700;line-height:1}
.tb-marque{align-self:flex-end;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.06em;color:var(--tb-encre-2);font-size:.95rem}
.prov{font-family:"Barlow Condensed",sans-serif;color:var(--tb-or);font-size:.7em;font-weight:600;margin-left:10px}
body.projection > :not(#projection){display:none !important}
#projection{position:fixed;inset:0;z-index:50;background:var(--tb-fond);overflow:auto}
#projection[hidden]{display:none}
#projection .tableau{min-height:100%;border-radius:0}
#projection .sortir{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3;opacity:.35;background:#fff;color:#111;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600}
#projection .sortir:focus-visible,#projection .sortir:hover{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(160%);background:var(--encre);color:var(--surface);padding:11px 18px;border-radius:8px;z-index:90;transition:transform .25s;max-width:min(580px,92vw);font-weight:500}
#toast.vu{transform:translateX(-50%) translateY(0)}
@media (max-width:860px){ .deux,.tb-milieu,.guide{grid-template-columns:1fr} .etapes{display:flex;flex-wrap:wrap;border-left:0;gap:4px 12px} .entete h1{font-size:1.5rem} .boutons .btn.grand{flex:1} }
@media (prefers-reduced-motion: reduce){ .clign,.actif .tb-nom{animation:none} #toast{transition:none} }
.tb-pied{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.org-chip{display:inline-flex;align-items:center;gap:10px;color:var(--tb-encre-2);font-size:.95rem}
.org-chip img{width:48px;height:48px;background:#fff;border-radius:8px;padding:3px;object-fit:contain}
.tb-marque{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:0}
.tb-marque .a{color:#FF3BA0}.tb-marque .b{color:#3C6DFF}
.org-chip img{background:#fff}
@media (max-width:760px){
  .onglets{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:none;background:#0C1534;border-top:1px solid #25305E;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:2px}
  .onglets button{flex:1;font-size:.98rem;padding:10px 2px;border-bottom:0;border-top:3px solid transparent}
  .onglets button[aria-selected="true"]{border-top-color:#FF3BA0}
  main{padding-bottom:110px}
  .org-logo{width:48px;height:48px}
  .cmeta span+span::before{margin:0 5px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:760px){
  .entete-in{padding:16px 14px 10px;gap:10px}
  .brand{font-size:1.85rem;white-space:nowrap}
  .demo{font-size:.7rem;margin-left:6px}
  .cname{font-size:1.15rem}
  .cmeta{font-size:.85rem}
  .tete-droite{flex-direction:row-reverse;align-items:center;gap:8px}
  .ib{height:36px;padding:0 10px}
}
@media (max-width:760px){
  .entete-in > div:first-child{min-width:0;flex:1}
  .brand{font-size:1.6rem}
  .tete-droite{flex-direction:column;align-items:flex-end;gap:6px}
  .org-logo{width:42px;height:42px;padding:2px}
  .ib{height:32px;padding:0 9px}
}
@media (max-width:760px){ .brand{white-space:normal} }
.tb-perf.ok{color:#6F93FF}
textarea{width:100%;background:var(--surface-2);border:1px solid var(--trait);border-radius:var(--rayon);padding:9px 10px;font-family:inherit;resize:vertical}
tr.grise td{opacity:.55}
.coche{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.coche input{width:20px;height:20px;accent-color:#FF3BA0}
.logo-apercu{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
.role{display:inline-block;margin-top:8px;background:#3C6DFF;color:#fff;border-radius:6px;padding:2px 10px;font-weight:600;font-size:.9rem}
td.detail{font-size:.85rem;color:var(--encre-2);white-space:normal;min-width:220px}
.qr-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.qr-carte{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--surface-2);border:1px solid var(--trait);border-radius:var(--rayon);padding:14px}
.qr-carte strong{font-family:"Barlow Condensed",sans-serif;font-size:1.4rem}
.qr-img{width:150px;height:150px;background:#fff;border-radius:6px;padding:6px}
.qr-img svg,.p-qr-i svg{width:100%;height:100%;display:block}
.tb-groupe h3{font-size:clamp(1.2rem,2vw,2rem);margin:6px 0 4px;color:#EEF1FF}
.tb-groupe + .tb-groupe{margin-top:6px}
/* dossard */
.dos-zone{display:grid;grid-template-columns:minmax(0,1.1fr) 1fr;gap:20px;align-items:start}
.dos-apercu{container-type:inline-size;border-radius:6px;overflow:hidden;border:1px solid var(--trait)}
.dos-apercu .dossard{width:100%;height:auto;aspect-ratio:210/148.5;font-size:calc(100cqw / 210)}
.dossard{width:210mm;height:148.5mm;font-size:1mm;position:relative;overflow:hidden;background:#0C1534;color:#EEF1FF;font-family:Barlow,"Segoe UI",sans-serif}
.dossard .d-bande{position:absolute;left:0;right:0;top:0;height:4em;background:linear-gradient(90deg,#3A6FF5,#A254CC,#F9429E)}
.d-f{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;line-height:1}
.d-marque,.d-comp,.d-num,.d-nom{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700}
.d-marque{color:#FF3BA0}
.d-comp{color:#3C6DFF;letter-spacing:.02em}
.d-num{line-height:.85;font-variant-numeric:tabular-nums}
.d-nom{font-weight:600}.d-nom b{font-weight:700}
.d-infos,.d-mention{color:#A6AFD6}
.d-logo img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:12%;padding:5%;display:block}
.dossard.clair{background:#fff;color:#0C1534}
.dossard.clair .d-infos,.dossard.clair .d-mention{color:#4A5480}
.dossard.clair .d-logo img{border:.3mm solid #D3D9EE}
#dos-apercu .d-f{cursor:grab;touch-action:none;outline:1.5px dashed transparent;outline-offset:3px;border-radius:2px}
#dos-apercu .d-f:hover{outline-color:rgba(166,175,214,.7)}
#dos-apercu .d-f.sel{outline:2px solid #FF3BA0}
#dos-apercu .d-f:active{cursor:grabbing}
.dch{list-style:none;margin:0;padding:0;border:1px solid var(--trait);border-radius:var(--rayon)}
.dch li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--trait)}
.dch li:last-child{border-bottom:0}
.dch li.sel{background:var(--piste-doux)}
.dch-nom{flex:1;text-align:left;background:none;border:0;padding:6px 0;font-weight:600;cursor:pointer}
.dch-t{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;color:var(--encre-2);font-size:.9rem}
#impression{display:none}
@media print{
  :root{padding:0}
  body.imprime > :not(#impression){display:none !important}
  body.imprime{background:#fff !important;color:#0C1534 !important}
  #impression{display:block !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .feuille-dos{break-after:page;width:210mm;height:297mm;overflow:hidden}
  .feuille-dos .dossard + .dossard{border-top:.2mm dashed #999}
  .dossard.vide-d{background:#fff}
  .p-doc{color:#0C1534;font-family:Barlow,"Segoe UI",sans-serif}
}
.p-tete{display:flex;justify-content:space-between;align-items:center;border-top:4px solid #FF3BA0;padding-top:4mm;margin-bottom:6mm}
.p-tete img{width:22mm;height:22mm;object-fit:contain}
.p-marque{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26pt;line-height:1}
.p-marque .a{color:#FF3BA0}.p-marque .b{color:#3C6DFF}
.p-comp{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15pt;margin-top:2mm}
.p-meta{color:#4A5480;font-size:9.5pt}
.p-h3{font-family:"Barlow Condensed",sans-serif;font-size:14pt;margin:6mm 0 2mm;color:#0C1534;break-after:avoid}
.p-table{font-size:9pt;color:#0C1534;break-inside:auto}
.p-table th{background:#E9EDF9;color:#0C1534;padding:1.5mm 2mm}
.p-table td{padding:1.5mm 2mm;border-bottom:.2mm solid #D3D9EE;color:#0C1534}
.p-table td.detail{color:#4A5480;font-size:8pt;min-width:0}
.p-table tr{break-inside:avoid}
.p-qr{display:flex;flex-direction:column;gap:8mm}
.p-qr-c{display:flex;align-items:center;gap:10mm;border:.4mm solid #D3D9EE;border-radius:3mm;padding:6mm;break-inside:avoid}
.p-qr-i{width:58mm;height:58mm;flex:none}
.p-qr-t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30pt;color:#FF3BA0;line-height:1}
.p-qr-c p{font-size:13pt;margin:2mm 0}
@media (max-width:860px){.dos-zone{grid-template-columns:1fr}}
[hidden]{display:none !important}
#toast:empty{display:none}
.pot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--trait);font-weight:600}
.pot > span:first-child{font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;margin-right:4px}
.pot-in{width:88px !important;min-height:44px !important;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:1.6rem !important;font-weight:700}
.pot .btn.petit{min-width:44px;min-height:44px;font-size:1.3rem}
.tb-pot{margin-top:12px;font-size:clamp(1.1rem,2vw,2rem);color:var(--tb-encre-2)}
.tb-pot strong{font-family:"Barlow Condensed",sans-serif;color:#EEF1FF;font-size:1.4em}
input.mini,select.mini{min-height:34px !important;padding:4px 8px !important;width:auto !important;max-width:170px}
input.mini.num{width:80px !important;text-align:right}
</style>

<body>
<header class="entete" id="entete">
  <div class="entete-in">
    <div>
      <p class="brand"><span class="a">#TEAMBRO</span> <span class="b">PV</span><span class="demo">DÉMO</span></p>
      <h1 class="cname" id="titre"></h1>
      <p class="cmeta" id="sous-titre"></p>
      <span class="role" id="role" hidden></span>
    </div>
    <div class="tete-droite">
      <img class="org-logo" id="org-logo" alt="Logo de l’organisateur">
      <button class="ib" data-act="theme" id="theme-btn" title="Changer de thème" aria-label="Changer de thème">◐</button>
    </div>
  </div>
  <nav class="onglets" role="tablist" id="onglets"></nav>
</header>
<main id="vue"></main>
<div id="projection" hidden></div>
<div id="impression"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;

const KEY="teambro-pv-v1";
const CYCLE=["","O","XO","XXO","X","XX","XXX","-","X-","XX-"];
const CATS=[["BE","Benjamins"],["MI","Minimes"],["CA","Cadets"],["JU","Juniors"],["ES","Espoirs"],["SE","Seniors"],["MA","Masters"],["NC","Catégorie à préciser"]];
const CLUBS=["AC2A","Bagnols Athlé","AC Nîmes","Uzès AC","Beaucaire AC"];
function defaults(){
  const L=[["Tom","VADANT","M",330],["Robin","AVRIL","M",350],["Thomas","AVRIL","M",370],["Pierre","ARNAL","M",320],["Colin","DUPIAT","M",340],
    ["Mia","GROUARD","F",300],["Salomé","POMEDIO","F",310],["Elisa","NOGIER","F",290],["Olivia","MAGNIN","F",320],["Victoria","MAGNIN","F",305]];
  return {comp:{nom:"PERCHE ELITE TOUR",date:"2026-11-08",lieu:"Bagnols-sur-Cèze",org:"AC2A",logo:LOGO,depart:240,pas:10},
    dosOpt:{fond:"sombre",club:true,cat:true,logo:true,mention:""},
    athletes:L.map((a,i)=>({id:"a"+(i+1),dos:i+1,prenom:a[0],nom:a[1],sexe:a[2],cat:"NC",club:"",poteaux:"",entree:240,niv:a[3],ordre:i+1,dns:false})),
    heights:[240],hIdx:0,att:{},fini:false,last:null,prevId:null,timerEnd:null,timerFor:null,seq:10,
    ui:{onglet:"secretariat",theme:"dark",noms:"complet",filtre:"tous"}};
}
let S, undo=[], guide={cle:null,step:0,type:null}, proj=null;
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):defaults()}catch(e){S=defaults()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Stockage plein : le logo est peut-être trop lourd.")}}
load();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fD=h=>h==null?"":(h/100).toFixed(2).replace(".",",");
const fH=h=>h==null?"—":fD(h)+" m";
const catNom=c=>(CATS.find(x=>x[0]===c)||[c,c])[1];
const jeune=c=>["BE","MI","CA","NC"].includes(c);
const grpLbl=(c,s)=>c==="NC"?(s==="F"?"Filles":"Garçons"):catNom(c)+" · "+(s==="F"?(jeune(c)?"Filles":"Femmes"):(jeune(c)?"Garçons":"Hommes"));
const catLbl=a=>grpLbl(a.cat,a.sexe);
const full=a=>a.prenom+" "+a.nom;
const clubTxt=a=>a.club||"";
const potTxt=a=>(a.poteaux===""||a.poteaux==null)?"à régler":a.poteaux+" cm";
const infos=a=>[clubTxt(a),catLbl(a)].filter(Boolean).join(" · ");
const disp=a=>S.ui.noms==="initiale"?a.prenom+" "+a.nom.charAt(0)+".":full(a);
const ordinal=n=>n===1?"1er":n+"e";
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function dateLong(){try{return new Date(S.comp.date+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return S.comp.date}}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("vu");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("vu"),2600)}

/* ---------- rôle verrouillé par QR ---------- */
const ROLES={juge:"concours",athlete:"athlete",spectateur:"spectateur"};
let role=null;
try{const h=(location.hash||"").slice(1);if(ROLES[h])sessionStorage.setItem("tb-role",h);role=sessionStorage.getItem("tb-role")}catch(e){const h=(location.hash||"").slice(1);if(ROLES[h])role=h}
if(role&&ROLES[role])S.ui.onglet=ROLES[role];else role=null;
const baseUrl=()=>location.href.split("#")[0];

/* ---------- moteur du concours ---------- */
const curH=()=>S.heights[S.hIdx];
const get=(a,h)=>(S.att[a.id]&&S.att[a.id][h])||"";
const nX=s=>(s.match(/X/g)||[]).length;
const ordered=()=>S.athletes.slice().sort((a,b)=>a.ordre-b.ordre);
const A=id=>S.athletes.find(a=>a.id===id);
function allSeq(a,avant){let s="";for(const h of S.heights){if(avant!=null&&h>=avant)break;s+=get(a,h)}return s}
function consecX(s){s=s.replace(/-/g,"");let n=0;for(let i=s.length-1;i>=0&&s[i]==="X";i--)n++;return n}
const isOut=a=>consecX(allSeq(a))>=3;
const started=()=>Object.values(S.att).some(o=>Object.values(o).some(v=>v));
function stateAt(a,h){if(a.dns)return "dns";if(a.entree>h&&!get(a,h))return "attente";const s=get(a,h);if(s.includes("O"))return "ok";if(s.endsWith("-"))return "passe";if(isOut(a))return "out";return null}
function active(){const h=curH();return ordered().filter(a=>stateAt(a,h)===null).sort((a,b)=>nX(get(a,h))-nX(get(b,h))||a.ordre-b.ordre)}
const remaining=()=>S.athletes.filter(a=>!a.dns&&!isOut(a));
const essaiN=(a,h)=>consecX(allSeq(a,h))+nX(get(a,h))+1;
function best(a){let b=null;S.heights.forEach(h=>{if(get(a,h).includes("O"))b=h});return b}
function ranking(list){
  const r=list.map(a=>{const b=best(a);return {a,b,xb:b==null?0:nX(get(a,b)),xt:nX(allSeq(a)),tried:allSeq(a).length>0}});
  r.sort((p,q)=>(p.a.dns-q.a.dns)||(q.b??-1)-(p.b??-1)||p.xb-q.xb||p.xt-q.xt||p.a.ordre-q.a.ordre);
  r.forEach((x,i)=>{const p=r[i-1];x.rang=(x.b==null||x.a.dns)?null:(p&&p.b===x.b&&p.xb===x.xb&&p.xt===x.xt?p.rang:i+1)});return r;
}
const perfTxt=x=>x.a.dns?"DNS":(x.b!=null?fD(x.b):(x.tried?"NM":""));
function groupes(list){
  const keys=[];CATS.forEach(([c])=>["F","M"].forEach(s=>{const l=list.filter(a=>a.cat===c&&a.sexe===s);if(l.length)keys.push({k:c+s,lbl:grpLbl(c,s),l})}));
  const autres=list.filter(a=>!CATS.some(x=>x[0]===a.cat));if(autres.length)keys.push({k:"autres",lbl:"Autres",l:autres});return keys;
}
function situation(){const h=curH(),act=active();return {h,courant:S.fini?null:act[0]||null,suivant:S.fini?null:act[1]||null,puis:S.fini?null:act[2]||null,act,monter:!S.fini&&!act.length}}
function dureeEssai(a){const n=remaining().length;if(S.prevId===a.id&&started())return 180;if(n<=1)return 300;if(n<=3)return 120;return 60}
function lancerChrono(){const s=situation();if(!s.courant)return;S.timerFor=s.courant.id;S.timerEnd=Date.now()+dureeEssai(s.courant)*1000;commit()}
function arreterChrono(){S.timerEnd=null;S.timerFor=null;commit()}
function snap(){const c=Object.assign({},S);delete c.ui;undo.push(JSON.stringify(c));if(undo.length>300)undo.shift()}
function annuler(){if(!undo.length)return;const ui=S.ui;S=JSON.parse(undo.pop());S.ui=ui;S.timerEnd=null;guide={cle:null,step:0};commit();toast("Dernière saisie annulée.")}
function finCheck(){S.fini=started()&&!remaining().length}
function saisir(m){
  const s=situation();if(!s.courant){toast("Aucun athlète à l’appel.");return}
  snap();const a=s.courant,h=s.h;S.att[a.id]=S.att[a.id]||{};S.att[a.id][h]=get(a,h)+m;
  S.last={c:m,id:a.id,h,t:Date.now()};S.prevId=a.id;S.timerEnd=null;S.timerFor=null;guide={cle:null,step:0};
  if(!remaining().length)S.fini=true;
  let msg=`${full(a)} : ${({O:"franchi",X:"échec","-":"passe"})[m]} à ${fH(h)}.`;if(m==="X"&&isOut(a))msg+=" Éliminé après 3 échecs.";
  commit();toast(msg);
}
function absent(id){const a=A(id);if(!a)return;snap();a.dns=!a.dns;if(S.timerFor===id){S.timerEnd=null;S.timerFor=null}guide={cle:null,step:0};finCheck();commit();toast(a.dns?`${full(a)} est déclaré absent (DNS).`:`${full(a)} est de nouveau présent.`)}
function monter(nh){nh=Math.round(nh);if(!(nh>curH())){toast("La nouvelle barre doit être au-dessus de "+fH(curH())+".");return}snap();S.heights.push(nh);S.hIdx=S.heights.length-1;commit();toast("Barre à "+fH(nh)+".")}
function corriger(id,h){const a=A(id);if(!a)return;const i=CYCLE.indexOf(get(a,h));snap();S.att[id]=S.att[id]||{};S.att[id][h]=CYCLE[(i+1)%CYCLE.length];finCheck();commit()}
function simuler(){const s=situation(),a=s.courant;if(!a)return false;const h=s.h;
  if(!get(a,h)&&h<a.niv-30&&Math.random()<.35){saisir("-");return true}
  saisir(Math.random()<1/(1+Math.exp((h-a.niv)/6))?"O":"X");return true}

const ONGLETS=[["secretariat","Secrétariat"],["resultats","Résultats"],["concours","Concours"],["athlete","Écran athlète"],["spectateur","Spectateurs"]];
function entete(){
  const c=S.comp;
  $("titre").textContent=c.nom;
  $("sous-titre").innerHTML=[dateLong(),c.lieu,"Saut à la perche"].map(x=>"<span>"+esc(x)+"</span>").join("");
  const lg=$("org-logo");if(c.logo){lg.src=c.logo;lg.hidden=false;lg.title=c.org}else lg.hidden=true;
  $("onglets").hidden=!!role;
  $("onglets").innerHTML=role?"":ONGLETS.map(([k,l])=>`<button role="tab" data-act="onglet" data-v="${k}" aria-selected="${S.ui.onglet===k}">${l}</button>`).join("");
  $("role").hidden=!role;$("role").textContent=role?({juge:"Accès juge",athlete:"Écran athlète",spectateur:"Accès spectateurs"})[role]:"";
  document.documentElement.dataset.theme=S.ui.theme==="light"?"light":"dark";
  $("theme-btn").title=S.ui.theme==="light"?"Passer en thème sombre":"Passer en thème clair";
}

/* ---------- 1. Secrétariat ---------- */
function vSecretariat(){
  const c=S.comp,o=S.dosOpt,lock=started(),nF=S.athletes.filter(a=>a.sexe==="F").length,nM=S.athletes.length-nF;
  const optCat=v=>CATS.map(([k,l])=>`<option value="${k}" ${k===v?"selected":""}>${l}</option>`).join("");
  return `<section class="bloc"><h2>Compétition</h2>
    <div class="grille"><label class="champ">Nom<input data-c="nom" value="${esc(c.nom)}"></label><label class="champ">Date<input type="date" data-c="date" value="${esc(c.date)}"></label>

function qrSvg(t){try{const q=qrcode(0,"M");q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return ""}}
function qrCartes(){const b=baseUrl();return [
  {titre:"Juge",txt:"Saisie des essais au sautoir",url:b+"#juge"},
  {titre:"Athlète",txt:"Barre, passage et temps restant",url:b+"#athlete"},
  {titre:"Spectateurs",txt:"Classements en direct",url:b+"#spectateur"}].map(q=>Object.assign(q,{svg:qrSvg(q.url)}))}
const DCH=[{k:"marque",lbl:"#TEAMBRO",x:44,y:20,t:13},{k:"comp",lbl:"Nom de la compétition",x:54,y:33,t:9},{k:"logo",lbl:"Logo",x:183,y:26,t:26},
  {k:"num",lbl:"Numéro",x:105,y:80,t:66},{k:"nom",lbl:"Prénom NOM",x:105,y:118,t:12},{k:"infos",lbl:"Club · catégorie",x:55,y:138,t:4.6},{k:"mention",lbl:"Mention ou lieu et date",x:155,y:138,t:4.6}];
let selDos=null;
function dPos(k){const d=DCH.find(f=>f.k===k),o=S.dosOpt;o.pos=o.pos||{};const p=o.pos[k]||{};
  return {x:p.x??d.x,y:p.y??d.y,t:p.t??d.t,vis:p.vis??(k==="logo"?o.logo!==false:true)}}
function setPos(k,ch){const o=S.dosOpt;o.pos=o.pos||{};o.pos[k]=Object.assign(dPos(k),ch)}
function htmlDossard(a,edit){
  const o=S.dosOpt,c=S.comp,info=[o.club?a.club:"",o.cat&&a.cat!=="NC"?catLbl(a):""].filter(Boolean).join(" · ");
  const contenu={marque:"#TEAMBRO",comp:esc(c.nom),num:String(a.dos),nom:`${esc(a.prenom)} <b>${esc(String(a.nom).toUpperCase())}</b>`,infos:esc(info),
    mention:esc(o.mention||[c.lieu,dateLong()].filter(Boolean).join(" · ")),logo:c.logo?`<img src="${esc(c.logo)}" alt="" draggable="false">`:""};
  const champs=DCH.map(f=>{const p=dPos(f.k);if(!p.vis||!contenu[f.k])return "";
    const st=f.k==="logo"?`width:${p.t}em;height:${p.t}em`:`font-size:${p.t}em`;
    return `<div class="d-f${edit&&selDos===f.k?" sel":""}" ${edit?`data-df="${f.k}" tabindex="0" title="${f.lbl} : glisser pour déplacer"`:""} style="left:${p.x}em;top:${p.y}em"><div class="d-${f.k}" style="${st}">${contenu[f.k]}</div></div>`}).join("");
  return `<div class="dossard ${o.fond==="clair"?"clair":""}"><div class="d-bande"></div>${champs}</div>`;
}
function imprimer(html,cls){
  const z=$("impression");z.className=cls||"";z.innerHTML=`<style>@media print{@page{size:A4 portrait;margin:${cls==="p-dos"?"0":"12mm"}}}</style>`+html;document.body.classList.add("imprime");
  setTimeout(()=>{try{window.print()}catch(e){toast("Impression indisponible ici : ouvrez la page depuis GitHub.")}},250);
}
window.addEventListener("afterprint",()=>{document.body.classList.remove("imprime");$("impression").innerHTML=""});
function imprimerDossards(list){
  if(!list.length){toast("Aucun athlète à imprimer.");return}
  const pages=[];for(let i=0;i<list.length;i+=2)pages.push(`<div class="feuille-dos">${htmlDossard(list[i])}${list[i+1]?htmlDossard(list[i+1]):'<div class="dossard vide-d"></div>'}</div>`);

function enteteImpression(t){return `<div class="p-tete"><div><div class="p-marque"><span class="a">#TEAMBRO</span> <span class="b">PV</span></div><div class="p-comp">${esc(S.comp.nom)} · ${esc(t)}</div><div class="p-meta">${esc(dateLong())} · ${esc(S.comp.lieu)} · ${esc(S.comp.org)}</div></div>${S.comp.logo?`<img src="${esc(S.comp.logo)}" alt="">`:""}</div>`}
function lireLogo(f){
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=280,k=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);S.comp.logo=cv.toDataURL("image/png");commit();toast("Logo mis à jour.")};img.src=r.result};r.readAsDataURL(f);
}
function parseImport(txt){
  const out=[];txt.split(/\r?\n/).forEach(l=>{if(!l.trim())return;const sep=l.includes("\t")?"\t":(l.includes(";")?";":",");const c=l.split(sep).map(x=>x.trim());
    if(/pr[ée]nom|^nom$/i.test(c[0])||/^nom$/i.test(c[1]||""))return;if(c.length<2)return;
    const sx=(c[2]||"").toUpperCase();const sexe=/^(F|FILLE|FEMME|W)/.test(sx)?"F":"M";
    const cs=(c[3]||"").toUpperCase().slice(0,2);const cat=(CATS.find(x=>x[0]===cs||x[1].toUpperCase().startsWith(cs))||["NC"])[0];
    const e=parseInt(c[5],10),pt=parseInt(c[6],10);out.push({prenom:c[0],nom:c[1],sexe,cat:cs?cat:"NC",club:c[4]||"",entree:e>0?e:S.comp.depart,poteaux:pt>=0?pt:""})});return out;
}
function nouvelAthlete(o){S.seq++;const a=Object.assign({id:"a"+S.seq+"_"+Date.now().toString(36),dos:Math.max(0,...S.athletes.map(x=>x.dos))+1,ordre:Math.max(0,...S.athletes.map(x=>x.ordre))+1,niv:o.entree+40,dns:false,poteaux:""},o);S.athletes.push(a);return a}

function exportCsv(){
  const L=[["Groupe","Place","Dossard","Prénom","Nom","Sexe","Catégorie","Club","Performance","Échecs à la barre","Échecs total","Détail"]];
  groupes(S.athletes).forEach(g=>ranking(g.l).forEach(x=>L.push([g.lbl,x.rang??"",x.a.dos,x.a.prenom,x.a.nom,x.a.sexe==="F"?"F":"G",catNom(x.a.cat),x.a.club,perfTxt(x),x.b!=null?x.xb:"",x.tried?x.xt:"",detailBarres(x.a)])));
  const csv="\ufeff"+L.map(r=>r.map(v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\r\n");
  try{const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const l=document.createElement("a");l.href=u;l.download="teambro-pv-resultats.csv";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Fichier CSV créé.")}catch(e){toast("Export impossible ici : ouvrez la page depuis GitHub.")}
}

/* ---------- 3. Concours ---------- */
function points(a,h,cls){
  const s=get(a,h),r=consecX(allSeq(a,h));let html="";
  for(let i=0;i<r;i++)html+=`<span class="${cls} R" title="Échec reporté">X</span>`;
  for(const ch of s)html+=ch==="-"?`<span class="${cls} P">–</span>`:`<span class="${cls} ${ch}">${ch}</span>`;
  for(let i=r+s.length;i<3;i++)html+=`<span class="${cls}"></span>`;return html;
}
function prochaineEntree(){const h=curH();const w=remaining().filter(a=>a.entree>h&&!best(a)&&!allSeq(a)).sort((a,b)=>a.entree-b.entree);return w[0]||null}
function htmlMonter(s){

}
function htmlFini(){

  ${role?"":`<div class="actions" style="justify-content:center"><button class="btn prim" data-act="onglet" data-v="resultats">Voir les résultats</button><button class="btn" data-act="rouvrir">Rouvrir le concours</button></div>`}`;

  ${ordered().map(a=>{const cls=s.courant&&s.courant.id===a.id?"au":(s.suivant&&s.suivant.id===a.id?"prep":((isOut(a)||a.dns)?"elim":""));

function etiqEtat(a,h){

  return `<section class="bloc">
    <div class="actions" style="margin-top:0;justify-content:flex-end">
      <div class="actions" style="margin:0">
        ${s.courant?`<button class="btn" data-act="chrono">${S.timerEnd?"Arrêter":"Chrono"} <span data-compte="essai">–</span></button>`:""}
        <button class="btn" data-act="annuler" ${undo.length?"":"disabled"}>Annuler le dernier</button>
        ${s.courant?`<button class="btn sable" data-act="sim">Saut simulé</button><button class="btn sable" data-act="sim10">10 sauts</button>`:""}
      </div></div>
    <h2 style="margin:14px 0 10px">${titre}</h2>${corps}
    ${!S.fini?`<div class="actions" style="border-top:1px dashed var(--trait);padding-top:12px"><span class="aide-courte">Clavier : O franchi, X échec, P passe, Z annuler, C chrono.</span><button class="btn petit" data-act="terminer" style="margin-left:auto">Terminer le concours</button></div>`:""}
  </section>${vFeuille(s)}
  <section class="bloc"><h3>Athlètes</h3><ul class="liste">${ordered().map(a=>`<li><span><strong>${a.dos}</strong> ${esc(full(a))} <span class="aide-courte">poteaux ${esc(potTxt(a))}</span></span><span>${S.fini&&!a.dns?"":etiqEtat(a,s.h)} <button class="btn petit" data-act="dns" data-id="${a.id}">${a.dns?"Présent":"DNS"}</button></span></li>`).join("")}</ul></section>`;
}

/* ---------- 4 et 5. Tableaux ---------- */
const logoOrg=()=>S.comp.logo?`<span class="org-chip"><img src="${esc(S.comp.logo)}" alt=""><span>${esc(S.comp.org)}</span></span>`:`<span class="org-chip">${esc(S.comp.org)}</span>`;
const pied=()=>`<div class="tb-pied">${logoOrg()}<div class="tb-marque"><span class="a">#TEAMBRO</span> <span class="b">PV</span></div></div>`;
function carteAuSaut(s,nomF,potOn){
  const a=s.courant;
  if(s.monter){const pe=prochaineEntree();return `<div class="tb-carte"><p class="tb-lbl">En attente</p><div class="tb-nom2">La barre monte</div>${pe?`<div class="tb-club">Prochaine entrée : ${esc(nomF(pe))} à ${fH(pe.entree)}</div>`:""}</div>`}
  return `<div class="tb-carte actif"><p class="tb-lbl"><span class="clign" style="background:#FF3BA0"></span>Au saut · ${ordinal(essaiN(a,s.h))} essai</p>
    <div class="tb-nom"><span class="tb-dos">${a.dos}</span>${esc(nomF(a))}</div><div class="tb-club">${esc(infos(a))}</div><div class="tb-pts">${points(a,s.h,"tb-pt")}</div>${potOn?`<div class="tb-pot">Poteaux <strong>${esc(potTxt(a))}</strong></div>`:""}
    ${s.suivant?`<div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--tb-trait)"><p class="tb-lbl">Se prépare</p><div class="tb-nom2">${esc(nomF(s.suivant))}</div>${potOn?`<div class="tb-club">Poteaux ${esc(potTxt(s.suivant))}</div>`:""}${s.puis?`<div class="tb-club">Puis ${esc(nomF(s.puis))}</div>`:""}</div>`:""}</div>`;
}
function dernierEssai(nomF){const L=S.last,d=L&&A(L.id);if(!d)return '<div class="tb-club">Aucun essai pour l’instant</div>';
  return `<div class="tb-club">${esc(nomF(d))}, ${fH(L.h)}</div><div class="tb-perf ${L.c!=="O"?"x":"ok"}">${L.c==="O"?"Franchi":(L.c==="X"?"Échec":"Passe")}</div>`}
function tbAthlete(){
  const s=situation();
  const milieu=S.fini?`<div class="tb-carte"><div class="tb-nom2">Concours terminé</div><div class="tb-club">Bravo à tous les athlètes !</div></div>`:`<div class="tb-milieu">${carteAuSaut(s,full,true)}
    <div style="display:flex;flex-direction:column;gap:14px"><div class="tb-carte"><p class="tb-lbl">Barre</p><div class="tb-perf" style="font-size:clamp(3.2rem,8vw,8rem)">${fD(s.h)}</div></div>
    <div class="tb-carte"><p class="tb-lbl">Temps restant</p><div class="tb-chrono" data-compte="essai">–</div></div></div></div>`;
  const rows=ordered().map(a=>{const st=stateAt(a,s.h);let e;
    if(st==="dns")e='<span class="tb-etat ko">DNS</span>';else if(S.fini)e="";else if(st==="ok")e='<span class="tb-etat ok">franchi</span>';else if(st==="passe")e='<span class="tb-etat">passe</span>';else if(st==="out")e='<span class="tb-etat ko">éliminé</span>';else if(st==="attente")e=`<span class="tb-etat">entre à ${fD(a.entree)}</span>`;else{const r=4-essaiN(a,s.h);e=`<span class="tb-etat ess">${r} essai${r>1?"s":""}</span>`}
    return `<tr class="${s.courant&&s.courant.id===a.id?"au":((isOut(a)||a.dns)?"elim":"")}"><td class="rg">${a.ordre}</td><td><strong>${esc(full(a))}</strong></td><td class="es">${a.poteaux===""?"—":a.poteaux+" cm"}</td><td>${e}</td><td class="pf">${fD(best(a))}</td></tr>`}).join("");
  return `<div class="tableau"><div class="tb-haut"><h2>${esc(S.comp.nom)}</h2><div class="tb-tour">${S.fini?"Résultats":(s.monter?"Montée de barre":"Barre "+fH(s.h))}</div></div>${milieu}
    <div class="tb-defil"><table><thead><tr><th>Ord.</th><th>Athlète</th><th>Poteaux</th><th>À cette barre</th><th style="text-align:right">Meilleure</th></tr></thead><tbody>${rows}</tbody></table></div>${pied()}</div>`;
}
let bravoTimer;
function tbSpectateur(){
  const s=situation(),gs=groupes(S.athletes),f=S.ui.filtre,vus=gs.filter(g=>f==="tous"||g.k===f);
  const L=S.last;let ban="";
  if(L&&L.c==="O"&&Date.now()-L.t<10000){const a=A(L.id);if(a){ban=`<div class="tb-record"><span class="tb-record-t">Bravo ${esc(a.prenom)} !</span><span>${fH(L.h)} franchi</span></div>`;clearTimeout(bravoTimer);bravoTimer=setTimeout(rendre,10050-(Date.now()-L.t))}}
  const milieu=S.fini?"":`<div class="tb-milieu">${carteAuSaut(s,disp)}
    <div style="display:flex;flex-direction:column;gap:14px"><div class="tb-carte"><p class="tb-lbl">Barre</p><div class="tb-perf" style="font-size:clamp(2.6rem,6vw,6rem)">${fD(s.h)} m</div></div><div class="tb-carte"><p class="tb-lbl">Dernier essai</p>${dernierEssai(disp)}</div></div></div>`;
  const tables=vus.map(g=>`<div class="tb-groupe"><h3>${esc(g.lbl)}${S.fini?"":'<span class="prov">provisoire</span>'}</h3><div class="tb-defil"><table><thead><tr><th>Pl.</th><th>Athlète</th><th>Club</th><th style="text-align:right">Meilleure</th></tr></thead><tbody>
    ${ranking(g.l).map(x=>`<tr class="${(isOut(x.a)&&!S.fini)||x.a.dns?"elim":""}"><td class="rg">${x.rang??""}</td><td><strong>${esc(disp(x.a))}</strong></td><td class="es">${esc(x.a.club||"—")}</td><td class="pf">${perfTxt(x)}</td></tr>`).join("")}</tbody></table></div></div>`).join("");
  return `<div class="tableau"><div class="tb-haut"><h2>${esc(S.comp.nom)}</h2><div class="tb-tour">${S.fini?"Résultats":"Saut à la perche · "+fH(s.h)}</div></div>${milieu}${ban}${tables}${pied()}</div>`;
}
function vAthlete(){return `${role?"":`<section class="bloc"><div class="actions" style="margin-top:0;justify-content:space-between"><h2>Écran athlète</h2><button class="btn prim" data-act="projeter" data-v="athlete">Plein écran</button></div><p class="aide-courte">À placer près du sautoir : la barre, qui saute avec ses poteaux, qui se prépare, le temps restant et l’état de chacun.</p></section>`}${tbAthlete()}`}
function vSpectateur(){const gs=groupes(S.athletes);if(S.ui.filtre!=="tous"&&!gs.some(g=>g.k===S.ui.filtre))S.ui.filtre="tous";
  return `<section class="bloc"><div class="actions" style="margin-top:0;justify-content:space-between"><h2>Spectateurs</h2>${role?"":`<button class="btn prim" data-act="projeter" data-v="spectateur">Plein écran</button>`}</div>
  <div class="actions"><div class="segment" role="group" aria-label="Classement">${[["tous","Tous les classements"]].concat(gs.map(g=>[g.k,g.lbl])).map(([k,l])=>`<button data-act="filtre" data-v="${k}" aria-pressed="${S.ui.filtre===k}">${esc(l)}</button>`).join("")}</div>
  <div class="segment" role="group" aria-label="Noms"><button data-act="noms" data-v="complet" aria-pressed="${S.ui.noms==="complet"}">Noms complets</button><button data-act="noms" data-v="initiale" aria-pressed="${S.ui.noms==="initiale"}">Prénom et initiale</button></div></div></section>${tbSpectateur()}`}

/* ---------- rendu ---------- */
function rendre(){
  entete();
  const v={secretariat:vSecretariat,resultats:vResultats,concours:vConcours,athlete:vAthlete,spectateur:vSpectateur}[S.ui.onglet]||vSecretariat;
  const y=window.scrollY;$("vue").innerHTML=v();window.scrollTo(0,y);
  if(proj)$("projection").innerHTML=(proj==="athlete"?tbAthlete():tbSpectateur())+'<button class="sortir" data-act="sortir">Quitter le plein écran</button>';
  tic();
}
function commit(){save();rendre()}
function tic(){const ms=S.timerEnd?S.timerEnd-Date.now():null;document.querySelectorAll("[data-compte]").forEach(el=>{el.textContent=ms==null?"–":mmss(ms);el.classList.toggle("urgent",ms!=null&&ms<=15000)})}
setInterval(tic,250);

/* ---------- actions ---------- */
const ACT={
  onglet:v=>{if(role)return;S.ui.onglet=v;save();rendre();window.scrollTo(0,0)},
  theme:()=>{S.ui.theme=S.ui.theme==="light"?"dark":"light";commit()},
  saisie:v=>saisir(v),
  dns:(v,b)=>{const a=A(b.dataset.id);if(!a)return;if(!a.dns&&allSeq(a)&&!confirm(full(a)+" a déjà sauté. Le déclarer absent quand même ?"))return;absent(a.id)},
  pot:(v,b)=>{const a=A(b.dataset.id);if(!a)return;const n=Math.max(0,Math.min(100,(parseInt(a.poteaux,10)||0)+parseInt(v,10)));a.poteaux=n;commit()},
  chrono:()=>S.timerEnd?arreterChrono():lancerChrono(),
  annuler:annuler,
  sim:()=>simuler(),
  sim10:()=>{for(let i=0;i<10;i++)if(!simuler())break},
  monter:v=>monter(parseInt(v,10)),
  "monter-libre":()=>monter(parseInt($("m-h").value,10)),
  cell:(v,b)=>corriger(b.dataset.id,parseInt(b.dataset.h,10)),
  terminer:()=>{if(confirm("Terminer le concours ? Les résultats deviendront définitifs.")){snap();S.fini=true;S.timerEnd=null;commit()}},
  rouvrir:()=>{snap();S.fini=false;commit()},
  filtre:v=>{S.ui.filtre=v;commit()},
  noms:v=>{S.ui.noms=v;commit()},
  projeter:v=>{proj=v;$("projection").hidden=false;document.body.classList.add("projection");rendre()},
  sortir:()=>{proj=null;$("projection").hidden=true;$("projection").innerHTML="";document.body.classList.remove("projection")},
  tirage:()=>{const l=S.athletes.slice();for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}l.forEach((a,i)=>a.ordre=i+1);commit();toast("Nouvel ordre de passage tiré au sort.")},
  reset:()=>{if(!confirm("Remettre la démo à zéro ? Les athlètes ajoutés et tous les essais seront effacés."))return;const ui=S.ui;S=defaults();S.ui=ui;undo=[];commit();toast("Démo remise à zéro.")},
  retirer:(v,b)=>{const a=A(b.dataset.id);if(!a||!confirm("Retirer "+full(a)+" de la liste ?"+(allSeq(a)?" Ses essais seront effacés.":"")))return;S.athletes=S.athletes.filter(x=>x!==a);delete S.att[a.id];ordered().forEach((x,i)=>x.ordre=i+1);finCheck();commit()},
  ajouter:()=>{const p=$("n-p").value.trim(),n=$("n-n").value.trim(),e=parseInt($("n-e").value,10),pt=parseInt($("n-pot").value,10);
    if(!p||!n){toast("Indiquez au moins le prénom et le nom.");return}
    const a=nouvelAthlete({prenom:p,nom:n,sexe:$("n-s").value,cat:$("n-c").value,club:$("n-club").value.trim(),entree:e>0?e:S.comp.depart,poteaux:pt>=0?pt:""});
    S.fini=false;commit();toast(`${p} ${n} est inscrit, dossard ${a.dos}.`)},
  "voir-import":()=>{const z=$("import");z.hidden=!z.hidden;if(!z.hidden)$("imp-txt").focus()},
  importer:v=>{const l=parseImport($("imp-txt").value);if(!l.length){toast("Aucune ligne reconnue.");return}
    if(v==="remplacer"){if(!confirm("Remplacer toute la liste et effacer les essais ?"))return;snap();S.athletes=[];S.att={};S.heights=[S.comp.depart];S.hIdx=0;S.fini=false;S.last=null}
    l.forEach(nouvelAthlete);S.fini=false;commit();toast(l.length+" athlète"+(l.length>1?"s":"")+" ajouté"+(l.length>1?"s":"")+".")},
  "sans-logo":()=>{S.comp.logo="";commit()},
  dossards:v=>imprimerDossards(ordered().filter(a=>v==="tous"||a.sexe===v).sort((a,b)=>a.dos-b.dos)),
  dsel:v=>{selDos=selDos===v?null:v;rendre()},
  dtaille:(v,b)=>{const p=dPos(v),st=(v==="num"||v==="logo")?2:.5;setPos(v,{t:Math.max(2,Math.round((p.t+st*parseInt(b.dataset.d,10))*10)/10)});selDos=v;commit()},
  dcentre:()=>{if(selDos){setPos(selDos,{x:105});commit()}},
  dreset:()=>{if(confirm("Revenir à la mise en page d’origine du dossard ?")){S.dosOpt.pos={};selDos=null;commit()}},
  "dossard-un":(v,b)=>{const a=A(b.dataset.id);if(a)imprimerDossards([a])},
  "imprimer-qr":()=>imprimer(enteteImpression("QR codes d’accès")+`<div class="p-qr">${qrCartes().map(q=>`<div class="p-qr-c"><div class="p-qr-i">${q.svg}</div><div><div class="p-qr-t">${q.titre}</div><p>${q.txt}</p><p class="p-meta">Scannez avec l’appareil photo du téléphone.</p></div></div>`).join("")}</div>`,"p-doc"),
  "imprimer-res":()=>imprimer(enteteImpression("Résultats "+(S.fini?"définitifs":"provisoires"))+groupes(S.athletes).map(g=>`<h3 class="p-h3">${esc(g.lbl)}</h3>${tableGroupe(g,true)}`).join(""),"p-doc"),
  csv:exportCsv
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.v,b)});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="f-logo"&&t.files[0]){lireLogo(t.files[0]);return}
  if(t.dataset.dv){setPos(t.dataset.dv,{vis:t.checked});commit();return}
  if(t.dataset.o){S.dosOpt[t.dataset.o]=t.type==="checkbox"?t.checked:t.value;commit();return}
  if(t.dataset.a){const a=A(t.dataset.id);if(!a)return;const f=t.dataset.a;let v=t.value.trim();
    if(f==="poteaux"){if(v===""){a.poteaux=""}else{v=parseInt(v,10);if(!(v>=0&&v<=100)){toast("Poteaux : une valeur entre 0 et 100 cm.");rendre();return}a.poteaux=v}}
    else if(f==="entree"){v=parseInt(v,10);if(!(v>0))return;a.entree=v}else a[f]=v;commit();return}
  const k=t.dataset&&t.dataset.c;if(!k)return;let v=t.value;
  if(k==="depart"||k==="pas"){v=parseInt(v,10);if(!(v>0))return}S.comp[k]=v;if(k==="depart"&&!started()){S.heights=[v];S.hIdx=0}commit()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&proj){ACT.sortir();return}
  if(S.ui.onglet!=="concours"||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase(),m={o:"O",x:"X",p:"-"}[k];
  if(m){saisir(m);e.preventDefault()}else if(k==="z"){annuler();e.preventDefault()}else if(k==="c"&&situation().courant){ACT.chrono();e.preventDefault()}
});
let drag=null;
document.addEventListener("pointerdown",e=>{const el=e.target.closest("#dos-apercu [data-df]");if(!el)return;e.preventDefault();
  const k=el.dataset.df,box=$("dos-apercu").getBoundingClientRect(),p=dPos(k);
  if(selDos!==k){selDos=k;document.querySelectorAll("#dos-apercu .d-f").forEach(x=>x.classList.toggle("sel",x===el));document.querySelectorAll(".dch li").forEach((li,i)=>li.classList.toggle("sel",DCH[i].k===k))}
  drag={k,el,sx:e.clientX,sy:e.clientY,x:p.x,y:p.y,mm:box.width/210,moved:false};try{el.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener("pointermove",e=>{if(!drag)return;const dx=(e.clientX-drag.sx)/drag.mm,dy=(e.clientY-drag.sy)/drag.mm;if(Math.abs(dx)+Math.abs(dy)>.5)drag.moved=true;
  drag.nx=Math.round(Math.min(210,Math.max(0,drag.x+dx))*2)/2;drag.ny=Math.round(Math.min(148.5,Math.max(0,drag.y+dy))*2)/2;
  drag.el.style.left=drag.nx+"em";drag.el.style.top=drag.ny+"em"});
document.addEventListener("pointerup",()=>{if(!drag)return;const d=drag;drag=null;if(d.moved)setPos(d.k,{x:d.nx,y:d.ny});commit()});
document.addEventListener("keydown",e=>{if(!selDos||S.ui.onglet!=="secretariat"||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!m)return;e.preventDefault();
  const p=dPos(selDos),f=e.shiftKey?5:1;setPos(selDos,{x:Math.min(210,Math.max(0,p.x+m[0]*f)),y:Math.min(148.5,Math.max(0,p.y+m[1]*f))});commit();
  const el=document.querySelector(`#dos-apercu [data-df="${selDos}"]`);if(el)el.focus()});
window.addEventListener("storage",e=>{if(e.key===KEY){const ui=S.ui;load();S.ui=ui;rendre()}});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(ROLES[h]&&!role){role=h;try{sessionStorage.setItem("tb-role",h)}catch(e){}S.ui.onglet=ROLES[h];rendre()}});
rendre();
})();
</script>
</body>
</html>
